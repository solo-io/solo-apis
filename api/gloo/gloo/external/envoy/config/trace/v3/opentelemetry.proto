syntax = "proto3";

package solo.io.envoy.config.trace.v3;

import "udpa/annotations/migrate.proto";
import "udpa/annotations/status.proto";
import "udpa/annotations/versioning.proto";
import "validate/validate.proto";
import "google/protobuf/wrappers.proto";

import "github.com/solo-io/solo-kit/api/v1/ref.proto";

option java_package = "io.envoyproxy.solo.io.envoy.config.trace.v3";
option java_outer_classname = "OpentelemetryProto";
option java_multiple_files = true;
option (solo.io.udpa.annotations.file_migrate).move_to_package = "envoy.extensions.tracers.opentelemetry.v4alpha";
option (solo.io.udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: OpenTelemetry tracer]

// Configuration for the OpenTelemetry tracer.
// [#extension: envoy.tracers.opentelemetry]
message OpenTelemetryConfig {
  option (solo.io.udpa.annotations.versioning).previous_message_type =
      "envoy.config.trace.v2.OpenTelemetryConfig";

  // The cluster to use for submitting traces to the OpenTelemetry agent.
  oneof collector_cluster {
    // The upstream to use for submitting traces to the OpenTelemetry agent.
    core.solo.io.ResourceRef collector_upstream_ref = 1;
    // The name of the Envoy cluster to use for submitting traces to the
    // OpenTelemetry agent
    string cluster_name = 2;
  }

  // Optional. If set, the service name will be used as the service name in the trace.
  // If this is not set it will be automatically set to the name of the 
  // listener + the namespace of the Gateway object
  string service_name = 3;

  // Optional. Current only gRPC is supported, but are intentionally using a oneof
  // to allow for future support of HTTP. This structure matches Envoy's.
  oneof service_type {
    // Optional gRPC transport options
    GrpcService grpc_service = 4;
  }

  // Optional. The maximum number of spans that can be cached.
  // If this buffer is exceeded, Envoy may begin dropping traces before they are sent to the collector.
  // https://opentelemetry.io/docs/specs/otel/performance/
  // Users should tune the setting based on their environment's expected telemetry volume and 
  // decide their preferences on resource usage vs. data loss.
  // If not specified, the default is 1024.
  google.protobuf.UInt32Value max_cache_size = 5;

  // Optional. The sampler the OpenTelemetry tracer uses to decide whether a span is recorded.
  // If not set, Envoy honors the sampled flag of an incoming trace context (e.g. the `trace-flags`
  // of a W3C `traceparent` header) and only applies the `tracePercentages` to requests that arrive
  // without one. `tracePercentages` cannot override an inbound parent's sampling decision; use the
  // `alwaysOn` sampler to record spans regardless of the parent's `trace-flags`.
  OpenTelemetrySampler sampler = 6;
}

message GrpcService {
  // Set the authority header when calling the gRPC service.
  string authority = 1;
}

// Sampler configuration for the OpenTelemetry tracer.
message OpenTelemetrySampler {
  oneof sampler {
    // Record every span, ignoring the sampling decision of an incoming trace context.
    // See https://www.envoyproxy.io/docs/envoy/latest/api-v3/extensions/tracers/opentelemetry/samplers/v3/always_on_sampler.proto
    AlwaysOnSampler always_on = 1;
    // Sample a deterministic percentage of traces based on the trace ID, so the decision is consistent across hops.
    // See https://www.envoyproxy.io/docs/envoy/latest/api-v3/extensions/tracers/opentelemetry/samplers/v3/trace_id_ratio_based_sampler.proto
    TraceIdRatioBasedSampler trace_id_ratio_based = 2;
    // Honor the sampling decision of an incoming trace context when present, and delegate to a root sampler otherwise.
    // See https://www.envoyproxy.io/docs/envoy/latest/api-v3/extensions/tracers/opentelemetry/samplers/v3/parent_based_sampler.proto
    ParentBasedSampler parent_based = 3;
  }
}

// A sampler that records every span.
message AlwaysOnSampler {}

// A sampler that records a percentage of traces based on the trace ID.
message TraceIdRatioBasedSampler {
  // Percentage of traces that should be sampled.
  // optional, defaults to 100.0
  // This should be a value between 0.0 and 100.0, with up to 6 significant digits.
  google.protobuf.FloatValue sampling_percentage = 1;
}

// A sampler that honors the sampling decision of an incoming trace context, and uses
// the root sampler for requests that arrive without one.
message ParentBasedSampler {
  // The sampler used when the request has no parent trace context.
  // optional, defaults to `alwaysOn`.
  oneof root_sampler {
    // Record every root span.
    AlwaysOnSampler always_on = 1;
    // Sample a percentage of root spans based on the trace ID.
    TraceIdRatioBasedSampler trace_id_ratio_based = 2;
  }
}

option go_package = "github.com/solo-io/solo-apis/pkg/api/gloo.solo.io/external/envoy/config/trace/v3";
import "extproto/ext.proto";
option (extproto.hash_all) = true;
option (extproto.clone_all) = true;
option (extproto.equal_all) = true;

