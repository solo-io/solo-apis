// A RootTrustPolicy is used to designate the root of trust, including the trust domain and root
// certificates used by one or more service meshes. With a RootTrustPolicy, you can set
// set up an Istio root CA and use that root CA to automatically issue intermediate CA certificates
// for all your workload clusters that make up your multicluster service mesh. Because all intermediate CA certificates are
// derived from the same root, your workloads can securely talk to each other, even across cluster boundaries.
// This approach is also referred to as federated trust.
//
// You have the option to fully or partially manage the Istio CA certificate lifecycle. The
// option that is right for you depends on the type of environment that you have and the level
// of control you want to have over the Istio CA certificate lifecycle.
//
// ## Examples
//
// The following example instructs {{% reuse "conrefs/snippets/policies/ov_fault_injection.md" %}} to 
// create a self-signed root CA certificate that is valid for 730 days. 
//
// ```yaml
// apiVersion: admin.gloo.solo.io/v2
// kind: RootTrustPolicy
// metadata:
//  name: root-trust-policy
//  namespace: gloo-mesh
// spec:
//   config:
//     mgmtServerCa:
//       generated:
//         ttlDays: 730
// ```
//
// To bring your own root CA certificate, store the root CA credentials in a Kubernetes secret. Then,
// reference this secret in your RootTrustPolicy. 
//
// ```yaml
// apiVersion: admin.gloo.solo.io/v2
// kind: RootTrustPolicy
// metadata:
//   name: istio-ingressgateway
//   namespace: gloo-mesh
// spec:
//   config:
//     mgmtServerCa:
//       secretRef:
//         name: my-root-trust-cert
//         namespace: gloo-mesh
// ```
//
// {{% alert %}}
// Creating a RootTrustPoliy resource triggers the renewal of Istio certificates.
// If your service mesh uses sidecars, you must restart your applications
// to apply the latest certificate.
// {{% /alert %}}
syntax = "proto3";

package admin.gloo.solo.io;

import "extproto/ext.proto";
import "github.com/solo-io/solo-apis/api/gloo.solo.io/common/v2/approval_state.proto";
import "github.com/solo-io/solo-apis/api/gloo.solo.io/common/v2/selectors.proto";
import "github.com/solo-io/solo-apis/api/gloo.solo.io/policy/v2/security/tls/ca_options.proto";
import "github.com/solo-io/skv2/api/core/v1/core.proto";

option go_package = "github.com/solo-io/solo-apis/client-go/admin.gloo.solo.io/v2";

option (extproto.equal_all) = true;
option (extproto.hash_all) = true;
option (extproto.clone_all) = true;

message RootTrustPolicySpec {

  // select the meshes where the root of trust will be applied.
  // If empty, will apply to all Meshes in the workspace.
  repeated .common.gloo.solo.io.MeshSelector apply_to_meshes = 1;

  // The details of the root of trust to apply to the selected meshes.
  Config config = 2;

  message Config {

    // different options for choosing the CA used to provide the root cert
    oneof certificate_authority_type {

      // Configure a Root Certificate Authority which will be shared by all Meshes associated with this RootTrustPolicy.
      // If this is not provided, a self-signed certificate will be generated by Gloo Mesh.
      MgmtServerCertificateAuthority mgmt_server_ca = 1;

      // Configures an Intermediate Certificate Authority which selected meshes will use to generate intermediate certificates.
      // The CA being used must be configured to generate the intermediate certificates.
      .tls.security.policy.gloo.solo.io.AgentCertificateAuthority agent_ca = 2;
    }

    // Configuration options for generated intermediate certs.
    .tls.security.policy.gloo.solo.io.CommonCertOptions intermediate_cert_options = 3;

    // This setting specifies whether or not workload pods should be automatically restarted
    // upon completion of a successful certificate issuance.
    bool auto_restart_pods = 4;

    // Specify parameters for configuring the root certificate authority for a RootTrustPolicy.
    message MgmtServerCertificateAuthority {

      // Specify the source of the Root CA data which Gloo Mesh will use for the RootTrustPolicy.
      oneof ca_source {

        // Generate a self-signed root certificate with the given options. By default, the root CA
        // is valid for 1 year.
        .tls.security.policy.gloo.solo.io.CommonCertOptions generated = 1;

        // The name of a Kubernetes secret in the same namespace as the RootTrustPolicy that contains the
        // root certificate authority.
        // Provided certificates must conform to a specified format, [documented here]({{< link path="/setup/prod/certs/relay/" >}}).
        .core.skv2.solo.io.ObjectRef secret_ref = 2;

      }
    }

    // Configure a Root Certificate Authority which will be used for validating certificates, but not signing them.
    // This CA can be used to rotate out expiring root certificates.
    repeated MgmtServerCertificateAuthority passive_certificate_authorities = 5;
  }
}

// <!--todo:(tjons) do we need to update this?-->
// The status of the policy after it is applied to your Gloo environment.
message RootTrustPolicyStatus {

  // The most recent generation observed in the object's metadata.
  // If the `observedGeneration` does not match `metadata.generation`, Gloo Mesh has not processed the most
  // recent version of this object.
  int64 observed_generation = 1;

  // Whether the resource has been accepted as valid and processed in the Gloo Mesh config translation.
  .common.gloo.solo.io.ApprovalState state = 2;

  // @exclude TODO(ilackarms): should we also show other qualities of the policy? e.g. where it is applied?
}
